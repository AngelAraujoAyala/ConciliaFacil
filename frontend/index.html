<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="512x512" href="/cf_favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConciliaFácil</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("concilia:theme");
        var isDark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      } catch (_) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
